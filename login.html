<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Accesso Admin - RecensioniLavoro</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    .login {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 25px;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 18px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 13px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #error {
      color: #dc2626;
      margin-top: 15px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="login">

  <h1>RecensioniLavoro</h1>

  <div class="subtitle">
    Accesso amministrazione
  </div>

  <form id="loginForm">

    <label for="email">
      Email
    </label>

    <input
      type="email"
      id="email"
      required
      autocomplete="email"
    >

    <label for="password">
      Password
    </label>

    <input
      type="password"
      id="password"
      required
      autocomplete="current-password"
    >

    <button type="submit">
      Accedi
    </button>

  </form>

  <div id="error"></div>

</div>

<script>

const SUPABASE_URL =
  "https://orvhpbbpaqbphnxajizs.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_nN_-EClb2m55_WOUKj7iJg_pXEa01Yq";

const { createClient } = supabase;

const db = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


document
  .getElementById("loginForm")
  .addEventListener("submit", async (event) => {

    event.preventDefault();

    const email =
      document.getElementById("email").value;

    const password =
      document.getElementById("password").value;

    const errorElement =
      document.getElementById("error");

    errorElement.textContent = "";

    const { error } =
      await db.auth.signInWithPassword({
        email,
        password
      });

    if (error) {

      console.error(error);

      errorElement.textContent =
        "Email o password non corretti.";

      return;
    }

    window.location.href = "admin.html";

  });

</script>

</body>
</html>
