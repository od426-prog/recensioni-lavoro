<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - RecensioniLavoro</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .review {
      background: white;
      border-radius: 14px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .company {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .location {
      color: #6b7280;
      margin-bottom: 18px;
    }

    .rating {
      color: #f59e0b;
      font-size: 20px;
      margin-bottom: 20px;
    }

    .section {
      margin-bottom: 15px;
    }

    .section strong {
      display: block;
      margin-bottom: 5px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 18px;
      cursor: pointer;
      font-weight: bold;
    }

    .approve {
      background: #16a34a;
      color: white;
    }

    .reject {
      background: #dc2626;
      color: white;
    }

    .empty {
      text-align: center;
      background: white;
      padding: 40px;
      border-radius: 14px;
      color: #6b7280;
    }
  </style>
</head>

<body>

<header>
  <h1>RecensioniLavoro — Amministrazione</h1>
</header>

<div class="container">

  <h2>Recensioni da moderare</h2>

  <div id="reviews">
    Caricamento...
  </div>
<h2 style="margin-top: 40px;">Recensioni pubblicate</h2>

<div id="publishedReviews">
  Caricamento...
</div>
</div>

<script>

const SUPABASE_URL =
  "https://orvhpbbpaqbphnxajizs.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_nN_-EClb2m55_WOUKj7iJg_pXEa01Yq";

const { createClient } = supabase;

const db = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


async function loadPendingReviews() {

  const container =
    document.getElementById("reviews");

  const { data, error } = await db
    .from("recensioni")
    .select(`
      id,
      valutazione,
      pro,
      contro,
      stato,
      created_at,
      aziende (
        nome,
        citta,
        provincia
      )
    `)
    .eq("stato", "pending")
    .order("created_at", {
      ascending: false
    });

  if (error) {

    console.error(error);

    container.innerHTML = `
      <div class="empty">
        Errore nel caricamento delle recensioni.
      </div>
    `;

    return;
  }


  if (!data || data.length === 0) {

    container.innerHTML = `
      <div class="empty">
        Nessuna recensione da moderare.
      </div>
    `;

    return;
  }


  container.innerHTML = data.map(review => {

    const company =
      review.aziende || {};

    const stars =
      "★".repeat(review.valutazione) +
      "☆".repeat(5 - review.valutazione);

    return `

      <div class="review" data-id="${review.id}">

        <div class="company">
          ${company.nome || "Azienda"}
        </div>

        <div class="location">
          📍 ${company.citta || ""}
          ${company.provincia || ""}
        </div>

        <div class="rating">
          ${stars}
        </div>

        <div class="section">
          <strong>👍 Pro</strong>
          ${review.pro || "Nessun commento"}
        </div>

        <div class="section">
          <strong>👎 Contro</strong>
          ${review.contro || "Nessun commento"}
        </div>

        <div class="buttons">

          <button
            class="approve"
            onclick="moderateReview('${review.id}', 'approved')">
            ✓ Approva
          </button>

          <button
            class="reject"
            onclick="moderateReview('${review.id}', 'rejected')">
            ✕ Rifiuta
          </button>

        </div>

      </div>

    `;

  }).join("");
}

async function loadPublishedReviews() {

  const container =
    document.getElementById("publishedReviews");

  const { data, error } = await db
    .from("recensioni")
    .select(`
      id,
      valutazione,
      pro,
      contro,
      stato,
      created_at,
      aziende (
        nome,
        citta,
        provincia
      )
    `)
    .eq("stato", "approved")
    .order("created_at", {
      ascending: false
    });

  if (error) {

    console.error(error);

    container.innerHTML = `
      <div class="empty">
        Errore nel caricamento delle recensioni pubblicate.
      </div>
    `;

    return;
  }

  if (!data || data.length === 0) {

    container.innerHTML = `
      <div class="empty">
        Nessuna recensione pubblicata.
      </div>
    `;

    return;
  }

  container.innerHTML = data.map(review => {

    const company =
      review.aziende || {};

    const stars =
      "★".repeat(review.valutazione) +
      "☆".repeat(5 - review.valutazione);

    return `
      <div class="review" data-id="${review.id}">

        <div class="company">
          ${company.nome || "Azienda"}
        </div>

        <div class="location">
          📍 ${company.citta || ""}
          ${company.provincia || ""}
        </div>

        <div class="rating">
          ${stars}
        </div>

        <div class="section">
          <strong>👍 Pro</strong>
          ${review.pro || "Nessun commento"}
        </div>

        <div class="section">
          <strong>👎 Contro</strong>
          ${review.contro || "Nessun commento"}
        </div>

        <div class="buttons">

          <button
            class="reject"
            onclick="deleteReview('${review.id}')">
            🗑️ Elimina
          </button>

        </div>

      </div>
    `;

  }).join("");
}
async function moderateReview(id, status) {

  const text =
    status === "approved"
      ? "Vuoi approvare questa recensione?"
      : "Vuoi rifiutare questa recensione?";

  if (!confirm(text)) {
    return;
  }

  const { error } = await db.rpc("moderate_review", {
    review_id: id,
    new_status: status
  });

  console.log("MODERATION ERROR:", error);

  if (error) {
    console.error(error);

    alert("Errore durante la modifica della recensione.");

    return;
  }

  alert(
    status === "approved"
      ? "Recensione approvata!"
      : "Recensione rifiutata!"
  );

  await loadPendingReviews();
}
async function deleteReview(id) {

  if (!confirm("Sei sicuro di voler eliminare definitivamente questa recensione?")) {
    return;
  }

  const { error } = await db.rpc("delete_review", {
    review_id: id
  });

  console.log("DELETE ERROR:", error);

  if (error) {
    console.error(error);
    alert("Errore durante l'eliminazione della recensione.");
    return;
  }

  alert("Recensione eliminata!");

  await loadPublishedReviews();
}

loadPendingReviews();
loadPublishedReviews();
</script>

</body>
</html>
